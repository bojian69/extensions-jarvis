<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI申请助手 - 状态窗口</title>
  <link rel="stylesheet" href="status-window.css">
</head>
<body>
  <div class="status-container">
    <div class="header">
      <h3>AI申请助手</h3>
      <button id="closeBtn">×</button>
    </div>
    
    <div class="status-content">
      <div class="step" id="step1">
        <div class="step-icon">1</div>
        <div class="step-text">检测页面支持</div>
        <div class="step-status" id="status1">等待中</div>
      </div>
      
      <div class="step" id="step2">
        <div class="step-icon">2</div>
        <div class="step-text">获取用户信息</div>
        <div class="step-status" id="status2">等待中</div>
      </div>
      
      <div class="step" id="step3">
        <div class="step-icon">3</div>
        <div class="step-text">打开申请页面</div>
        <div class="step-status" id="status3">等待中</div>
      </div>
      
      <div class="step" id="step4">
        <div class="step-icon">4</div>
        <div class="step-text">自动填充表单</div>
        <div class="step-status" id="status4">等待中</div>
      </div>
    </div>
    
    <div class="info-panel" id="infoPanel" style="display: none;">
      <h4>申请信息</h4>
      <div id="infoContent"></div>
    </div>
  </div>
  
  <script src="status-window.js"></script>
</body>
</html>
